name: daily-news

on:
  schedule:
    # 11:00 UTC = 08:00 hora Argentina (no tiene horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar news.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_news.py

      - name: Commitear si cambió
        run: |
          git config user.name "agente-noticias-ia"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || git commit -m "news: actualización $(date -u +%F)"
          git push
